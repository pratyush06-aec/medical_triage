<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ArogyaLav - Smart Medical Triage</title>

    <!-- Tailwind CSS (v3 CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- UI Effects & Animations -->
    <link rel="stylesheet" href="/static/ui-effects.css">

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="/static/assets/logo/arogyalav-icon.png"
    />

    <!-- App Scripts -->
    <script defer src="/static/app_v2.js"></script>
    <script defer src="/static/auth.js"></script>
    <script defer src="/static/voice.js"></script>
    <!-- 🔧 MODIFICATION: Voice command support -->
    <!-- NOTE: voice.js must define startVoiceInput() -->
    <script defer src="/static/voice.js"></script>
</head>

<body class="bg-emerald-50/40 font-sans text-gray-900">

<!-- ================= AUTH VIEW ================= -->
<div
    id="auth-view"
    style="display:none;"
    class="min-h-screen flex items-center justify-center"
></div>

<!-- ================= APP ================= -->
<div id="chat-view" style="display:none;">

    <!-- Header -->
    <header class="bg-white border-b border-emerald-200">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-3">
                    <img
                        src="/static/assets/logo/arogyalav-icon.png"
                        alt="ArogyaLav logo"
                        class="h-9 w-9"
                    />

                    <div class="flex flex-col leading-tight">
                        <span class="text-lg font-semibold tracking-tight text-gray-900">
                            ArogyaLav
                        </span>
                        <span class="text-xs font-medium tracking-wide text-emerald-600">
                            Smart Medical Triage
                        </span>
                    </div>
                </div>
            </div>

            <div class="flex gap-2">
                <button
                    id="profileBtn"
                    type="button"
                    class="text-sm px-3 py-1 rounded border border-gray-300 text-gray-700 hover:bg-gray-100"
                >
                    Profile
                </button>

                <button
                    onclick="logout()"
                    class="text-sm px-3 py-1 rounded bg-red-600 hover:bg-red-700 text-white"
                >
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Chat -->
    <main class="max-w-3xl mx-auto px-4 py-6">

        <!-- Intro -->
        <p class="text-sm text-gray-700 mb-3">
            Describe your symptoms and I’ll guide you to appropriate care.
        </p>

        <!-- Chat Box -->
        <div
            id="chat-box"
            class="h-96 overflow-y-auto mb-4 p-4 bg-white border border-gray-200 rounded-lg space-y-3"
        ></div>

        <!-- System Thinking Bar (Signature UX) -->
        <div
            id="thinking-bar"
            class="hidden h-1 rounded bg-emerald-500/70 mb-2 overflow-hidden"
        >
            <div class="h-full bg-emerald-600 animate-pulse"></div>
        </div>

        <!-- ================= INPUT AREA ================= -->

        <!-- ❌ OLD INPUT AREA (COMMENTED — DO NOT DELETE) -->
        <!--
        <div class="flex gap-2">
            <input
                id="user-input"
                type="text"
                autocomplete="off"
                placeholder="Describe your symptoms..."
                class="flex-1 px-3 py-2 border border-gray-300 rounded-md
                       focus:outline-none focus:ring-2 focus:ring-emerald-300"
                onkeydown="if(event.key === 'Enter') sendMessage()"
            />

            <button
                onclick="sendMessage()"
                class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white
                       rounded-md font-medium"
            >
                Continue
            </button>
        </div>
        -->

        <!-- ✅ MODIFIED INPUT AREA WITH VOICE COMMAND SUPPORT -->
        <div class="flex gap-2 items-center">

            <!-- 🎤 Voice Input Button -->
            <button
                id="voiceBtn"
                type="button"
                title="Speak your symptoms"
                class="px-3 py-2 rounded-md border border-gray-300
                       hover:bg-gray-100 text-gray-700"
                onclick="startVoiceInput()"
            >
                🎤
            </button>

            <input
                id="user-input"
                type="text"
                autocomplete="off"
                placeholder="Describe your symptoms..."
                class="flex-1 px-3 py-2 border border-gray-300 rounded-md
                       focus:outline-none focus:ring-2 focus:ring-emerald-300"
                onkeydown="if(event.key === 'Enter') sendMessage()"
            />

            <button
                onclick="sendMessage()"
                class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white
                       rounded-md font-medium"
            >
                Continue
            </button>
        </div>

        <!-- ================= END INPUT AREA ================= -->

    </main>
</div>

<!-- ================= PROFILE ================= -->
<div
    id="profile-view"
    style="display:none;"
    class="max-w-3xl mx-auto px-4 py-6"
>
    <div class="bg-white border border-gray-200 rounded-lg p-5">
        <div class="flex justify-between items-center mb-5">
            <h2 class="text-lg font-semibold">My Appointments</h2>

            <button
                id="backToChatBtn"
                type="button"
                class="text-sm px-3 py-1 rounded bg-blue-600 hover:bg-blue-700 text-white"
            >
                Back to Chat
            </button>
        </div>

        <div id="profileContent" class="text-sm text-gray-700"></div>
    </div>
</div>

</body>
</html>
