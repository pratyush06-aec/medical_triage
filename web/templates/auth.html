<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Medical Triage Assistant | Secure Login</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- UI Effects & Animations -->
  <link rel="stylesheet" href="/static/ui-effects.css">
</head>

<body class="min-h-screen bg-emerald-50/40 flex items-center justify-center font-sans text-gray-900">

<!-- ================= AUTH CARD ================= -->
<div class="w-full max-w-md bg-white border border-emerald-200 rounded-xl p-6 shadow-sm view-transition">

  <!-- Header -->
  <div class="text-center mb-6">
    <div class="text-emerald-600 text-2xl mb-1">🏥</div>
    <h1 class="text-xl font-semibold">
      Medical Triage Assistant
    </h1>
    <p class="text-sm text-gray-600">
      Secure access to your care
    </p>
  </div>

  <!-- Error -->
  <div
    id="auth-error"
    class="text-sm text-red-600 mb-4"
    style="display:none;"
  ></div>

  <!-- Form -->
  <form onsubmit="return false;" class="space-y-4">

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Email address
      </label>
      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        class="w-full px-3 py-2 border border-gray-300 rounded-md
               focus:outline-none focus:ring-2 focus:ring-emerald-300"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Password
      </label>
      <input
        id="password"
        type="password"
        placeholder="••••••••"
        class="w-full px-3 py-2 border border-gray-300 rounded-md
               focus:outline-none focus:ring-2 focus:ring-emerald-300"
      />
    </div>

    <!-- Actions -->
    <div class="pt-2 space-y-2">
      <button
        id="loginBtn"
        data-label="Login"
        type="button"
        onclick="login()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white
               py-2 rounded-md font-medium"
      >
        Login
      </button>

      <button
        id="signupBtn"
        data-label="Sign Up"
        type="button"
        onclick="signup()"
        class="w-full border border-gray-300 text-gray-700
               py-2 rounded-md font-medium hover:bg-gray-100"
      >
        Sign Up
      </button>
    </div>
  </form>

  <!-- Footer -->
  <p class="text-xs text-gray-500 text-center mt-6">
    Your information is handled securely and confidentially.
  </p>
</div>

<!-- Auth Logic -->
<script src="/static/auth.js"></script>

</body>
</html>
